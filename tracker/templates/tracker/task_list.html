{% extends "tracker/base.html" %}
{% block content %}
<h1>All Tasks</h1>
<table>
    <tr><th>Title</th><th>Subject</th><th>Deadline</th><th>Effort</th><th>Priority Score</th></tr>
    {% for task in tasks %}
    <tr>
        <td>{{ task.title }}</td>
        <td>{{ task.subject.name }}</td>
        <td>{{ task.deadline }}</td>
        <td>{{ task.estimated_effort }}/5</td>
        <td>{{ task.priority_score }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
